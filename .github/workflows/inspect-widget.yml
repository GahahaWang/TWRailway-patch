name: Inspect widget

# Temporary: dumps manifest, native and Dart code related to the live route widget,
# so they can be read from the job log.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/project-thread-vypmb2

env:
  APK_URL: https://drive.usercontent.google.com/download?id=16G97lUdjIQ8HjX1rO9NMuPj30nF4lR37&export=download&confirm=t

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download and unpack
        run: |
          curl -fsSL -o app.xapk "$APK_URL"
          mkdir x && cd x && unzip -q ../app.xapk
          ls -la
          mkdir base arm && unzip -q com.tsumii.trainschedule.apk -d base
          for f in config.arm64_v8a.apk split_config.arm64_v8a.apk; do [ -f "$f" ] && unzip -q "$f" -d arm || true; done

      - name: Blutter
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q python3-pyelftools python3-requests git cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev
          git clone --depth 1 https://github.com/worawit/blutter.git
          LIBDIR=$(dirname "$(find x/arm -name libapp.so | head -1)")
          python3 blutter/blutter.py "$LIBDIR" bout > blutter.log 2>&1 || { tail -80 blutter.log; exit 1; }
          tail -5 blutter.log

      - name: Blutter matches
        run: |
          cd bout/asm/trainschedule
          for f in data/widget/WidgetRefresher.dart data/widget/WidgetService.dart data/widget/WidgetConfig.dart data/subscription/SubscriptionConfig.dart component/WidgetSettingsPage.dart; do
            echo "======== $f ($(wc -l < $f) lines)"
            grep -nE '^ *(static |)[A-Za-z_<>?, ]+ [a-zA-Z_]+\(|^class |^ *// .*(\[pp\+0x[0-9a-f]+\] "[^"]*"|r[0-9]+ = (true|false))|bl +0x[0-9a-f]+ *; \[' "$f" | grep -vE 'AllocateStack|_stackOverflow|StackOverflow' | sed -E 's/^([0-9]+:) +/\1 /' | grep -vE 'Allocate[A-Z]|WriteBarrier|InitLateStaticField' | head -700
          done
          echo "== entitlement / premium refs =="
          grep -rn -iE '"[^"]*(entitle|premium|isPro|pro_|subscri|vip|unlock)[^"]*"' . | grep -oE '"[^"]*"' | sort | uniq -c | sort -rn | head -120
          echo "== who reads widget_subscribed / isSubscribed =="
          grep -rln -iE 'isSubscribed|isPremium|hasEntitlement|isPro\b|get:isPro|widgetUnlocked|isWidget' . | head -60
          grep -rn -E '^  [A-Za-z_<>?, ]+ (get:)?[a-zA-Z_]*([Ss]ubscri|[Pp]remium|[Pp]ro[A-Z]|[Ee]ntitle|[Uu]nlock)[a-zA-Z_]*\(' . | head -120

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: inspect-widget
          path: |
            dart.txt
            bout/asm
