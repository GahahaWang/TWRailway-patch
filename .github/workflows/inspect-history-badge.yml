name: Inspect history badge

# Temporary: dumps the Dart code of the search history count and upgrade badge.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/project-thread-h38tt0

env:
  APK_URL: https://drive.usercontent.google.com/download?id=16G97lUdjIQ8HjX1rO9NMuPj30nF4lR37&export=download&confirm=t

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download and unpack
        run: |
          curl -fsSL -o app.xapk "$APK_URL"
          mkdir x && cd x && unzip -q ../app.xapk
          mkdir arm && unzip -q config.arm64_v8a.apk -d arm

      - name: Blutter
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q python3-pyelftools python3-requests git cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev
          git clone --depth 1 https://github.com/worawit/blutter.git
          LIBDIR=$(dirname "$(find x/arm -name libapp.so | head -1)")
          python3 blutter/blutter.py "$LIBDIR" bout > blutter.log 2>&1 || { tail -80 blutter.log; exit 1; }

      - name: Dump
        run: |
          SO=$(find x/arm -name libapp.so | head -1)
          python3 - "$SO" <<'PY'
          import sys, struct
          d=open(sys.argv[1],'rb').read()
          pats={
            'clamp':[0xf840b020,0xb6f80060,0xd2800000,0x14000004,0xf1000c1f,0x5400004d,0xd2800060,0xf81f83a0],
            'text':[0x91407370,0xf9466e10,0xb801f050,0x91407361,0xf9467021],
            'limit':[0xaa0003e3,0xf85c83a0,0xf81e83a3,0xf800b060,0xd2800060,0xf8013060],
          }
          for k,v in pats.items():
              b=b''.join(struct.pack('<I',w) for w in v)
              offs=[i for i in range(0,len(d)-len(b),4) if d[i:i+len(b)]==b]
              print(k,[hex(o) for o in offs])
          PY
          cd bout
          echo "======== pool strings"
          grep -nE 'String: "\)"$' pp.txt | head -5
          sed -n 104,110p pp.txt | cat -A | cut -c1-120
          echo "======== asm uses of empty and close paren"
          grep -rhoE '\[pp\+0x[0-9a-f]+\] ""$' asm | sort | uniq -c | sort -rn | head -5
          grep -rhoE '\[pp\+0x[0-9a-f]+\] "\)"$' asm | sort | uniq -c | sort -rn | head -5
          grep -rhE '; \[pp\+0x[0-9a-f]+\] ""$' asm | head -5
          grep -rhE '; \[pp\+0x[0-9a-f]+\] "\)"$' asm | head -5

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: inspect
          path: bout/pp.txt
