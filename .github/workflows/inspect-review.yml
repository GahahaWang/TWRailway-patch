name: Inspect review prompt

# Temporary: dumps the Dart code that shows the "喜歡這個App嗎？" review dialog.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/project-thread-xdjar9

env:
  APK_URL: https://drive.usercontent.google.com/download?id=16G97lUdjIQ8HjX1rO9NMuPj30nF4lR37&export=download&confirm=t

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download and unpack
        run: |
          curl -fsSL -o app.xapk "$APK_URL"
          mkdir x && cd x && unzip -q ../app.xapk
          mkdir arm && unzip -q config.arm64_v8a.apk -d arm

      - name: Blutter
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q python3-pyelftools python3-requests git cmake ninja-build build-essential pkg-config libicu-dev libcapstone-dev
          git clone --depth 1 https://github.com/worawit/blutter.git
          LIBDIR=$(dirname "$(find x/arm -name libapp.so | head -1)")
          python3 blutter/blutter.py "$LIBDIR" bout > blutter.log 2>&1 || { tail -80 blutter.log; exit 1; }

      - name: Dump
        run: |
          cd bout
          echo "======== files"
          grep -rlE 'shouldShowReview|remindReview|canShowReview|_tryToShowReviewDialog|rate\.likeTitle|AppReviewView|rateMyApp|RateMyApp' asm | sort
          echo "======== AppReviewView.dart"
          cat asm/trainschedule/component/AppReviewView.dart
          echo "======== callers"
          python3 - <<'PY'
          import re, glob
          keys=('shouldShowReview','remindReview','canShowReview','_tryToShowReviewDialog','_initReviewData','AppReviewView','RateMyApp','rateMyApp','session_count','updateRemindReview')
          for path in sorted(glob.glob('asm/trainschedule/**/*.dart', recursive=True)):
              if path.endswith('component/AppReviewView.dart'): continue
              src=open(path, errors='replace').read()
              funcs=re.split(r'\n(?=  [^ /].*\(/\*)', src)
              for f in funcs:
                  if any(k in f for k in keys):
                      print('########', path, f.strip().split('\n')[0])
                      print(f)
          PY
          echo "======== pp strings"
          grep -nE 'Review|review|rate\.|rateMyApp|session_count' pp.txt | head -80
          echo "======== translations"
          grep -rn 'rate\.' asm/trainschedule/i18n 2>/dev/null | head -60

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: inspect
          path: bout/asm/trainschedule
