name: Inspect developer settings

# Temporary: dumps manifest, decompiled app code and Dart strings that look like
# developer / debug settings, so they can be read from the job log.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/project-thread-efyuhq

env:
  APK_URL: https://drive.usercontent.google.com/download?id=16G97lUdjIQ8HjX1rO9NMuPj30nF4lR37&export=download&confirm=t
  PAT: '(debug|developer|devmode|dev_mode|dev mode|devoption|dev_option|testmode|test_mode|isdev|isdebug|isbeta|beta|staging|admin|hidden|secret|easter|unlock|kdebug|kreleasemode|kprofilemode|開發|除錯|測試|隱藏)'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download and unpack
        run: |
          curl -fsSL -o app.xapk "$APK_URL"
          mkdir x && cd x && unzip -q ../app.xapk && ls -la
          cat manifest.json || true
          mkdir base arm && unzip -q com.tsumii.trainschedule.apk -d base
          for f in config.arm64_v8a.apk split_config.arm64_v8a.apk; do [ -f "$f" ] && unzip -q "$f" -d arm || true; done
          find arm -name '*.so' | xargs ls -la

      - name: Dart snapshot strings
        run: |
          SO=$(find x/arm -name libapp.so | head -1)
          strings -n 4 "$SO" > dart.txt
          strings -n 4 -e l "$SO" >> dart.txt || true
          wc -l dart.txt
          echo "== keyword matches =="
          grep -iE "$PAT" dart.txt | sort -u | head -600
          echo "== app package uris =="
          grep -oE 'package:[a-zA-Z0-9_]+/[^ ]+' dart.txt | grep -vE 'package:(flutter|firebase|_flutterfire|characters|collection|crypto|csslib|equatable|get|html|http|intl|path|vector_math|meta|async|typed_data|source_span|string_scanner|term_glyph|web|xml|google_mobile_ads|shared_preferences|url_launcher|webview|plugin_platform|rate_my_app|in_app|home_widget|package_info|geolocator|cached|sqflite|uuid|logging|petitparser|clock|fixnum|protobuf|grpc|json|flutter_)' | sort -u | head -300
          for k in debug_live_map AnalyticsDebugRecorder debugEnabledFeatureFlags widget.unlock 'unlock failed' DebuggableCondition; do
            echo "== context: $k =="
            grep -n -F -m 3 "$k" dart.txt | while IFS=: read n _; do sed -n "$((n-25)),$((n+25))p" dart.txt; echo -----; done
          done
          echo "== CJK strings =="
          python3 - "$SO" <<'PY'
          import re,sys
          d=open(sys.argv[1],'rb').read()
          out=set()
          for m in re.finditer(rb'[\x20-\x7e\xc0-\xff\x80-\xbf]{6,}',d):
              try: t=m.group().decode('utf-8')
              except: continue
              if re.search(r'[\u4e00-\u9fff]',t): out.add(t)
          print(len(out))
          for t in sorted(out):
              if re.search(r'設定|開發|測試|除錯|版本|隱藏|進階|實驗|管理|偵錯|模式|debug|Debug',t): print(t[:200])
          PY
          echo "== translation keys =="
          grep -oE 'word\.word[A-Za-z0-9_]*|app\.[A-Za-z0-9_]+|setting[A-Za-z0-9_.]*' dart.txt | sort -u | head -400
          echo "== remote config / prefs keys =="
          grep -E '^[a-z][a-z0-9]*(_[a-z0-9]+)+$' dart.txt | sort -u | head -400
